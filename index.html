<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setlist Manager - April Crew / Local 13 / Underground Escape</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .print-watermark { display: none !important; }
      .track-item { break-inside: avoid; border: 1px solid #ddd !important; background: white !important; color: black !important; margin-bottom: 4px !important; padding: 4px 8px !important; }
      .text-slate-300, .text-slate-400, .text-slate-100 { color: #111 !important; }
      .bg-emerald-500\/10, .bg-slate-800\/60 { background: transparent !important; }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 3px; }
    .drag-ghost { opacity: 0.35; transform: scale(0.98); background: #334155 !important; }
    .drag-target-indicator { border-top: 2px solid #10b981 !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative flex flex-col font-sans select-none antialiased overflow-x-hidden">

  <!-- MARCA DE AGUA DE FONDO DINÁMICA SEGÚN BANDA -->
  <div class="fixed inset-0 pointer-events-none flex items-center justify-center z-0 overflow-hidden print-watermark">
    <div id="bgWatermark" class="w-[85vw] max-w-[550px] aspect-square rounded-full transition-all duration-500 opacity-[0.08] bg-center bg-no-repeat bg-contain filter contrast-125"></div>
  </div>

  <!-- CABECERA PRINCIPAL: SELECTOR DE GRUPO + ACCIONES SUPERIORES -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 shadow-lg px-3 py-2">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
      
      <!-- IZQUIERDA: GRUPO EXCLUSIVO (Sin superposiciones) -->
      <div class="flex items-center gap-2 min-w-0 flex-shrink-0">
        <!-- Logo circular avatar -->
        <div id="bandAvatar" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-800 border border-slate-700 bg-center bg-contain bg-no-repeat shrink-0 shadow-inner overflow-hidden"></div>
        
        <!-- Selector de Grupo directo -->
        <div class="relative">
          <select id="bandSelect" onchange="changeBand(this.value)" class="bg-slate-800 text-xs sm:text-sm font-bold text-emerald-400 hover:text-emerald-300 border border-slate-700 rounded-lg px-2 sm:px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-emerald-500 cursor-pointer transition shadow-sm max-w-[155px] sm:max-w-none truncate">
            <option value="april_crew">April Crew</option>
            <option value="local_13">Local 13</option>
            <option value="underground_escape">Underground Escape</option>
          </select>
        </div>
      </div>

      <!-- DERECHA: GUARDAR, ESTADO Y MENÚ DE OPCIONES -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0 ml-auto">
        <!-- Indicador de Estado de Guardado -->
        <span id="saveStatusBadge" class="text-[10px] sm:text-xs font-semibold px-2 py-1 rounded-md border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 transition-colors whitespace-nowrap">
          Guardado
        </span>

        <!-- Botón Guardar Manual -->
        <button onclick="saveManual()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-2 sm:px-2.5 py-1.5 rounded-lg shadow flex items-center gap-1 active:scale-95 transition">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
          <span class="hidden sm:inline">Guardar</span>
        </button>

        <!-- Botón + Añadir Canción -->
        <button onclick="openAddModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-2 py-1.5 rounded-lg border border-slate-700 flex items-center gap-1 active:scale-95 transition" title="Añadir canción">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span class="hidden sm:inline">Tema</span>
        </button>

        <!-- MENÚ DESPLEGABLE SUPERIOR DERECHO (Acciones) -->
        <div class="relative">
          <button id="menuToggleBtn" onclick="toggleDropdownMenu(event)" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-1.5 rounded-lg border border-slate-700 flex items-center justify-center active:scale-95 transition" title="Opciones">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
          </button>

          <!-- Ventana flotante de menú -->
          <div id="actionMenu" class="hidden absolute right-0 mt-2 w-56 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl py-1 z-50 text-xs">
            <div class="px-3 py-1.5 border-b border-slate-800 text-[10px] uppercase font-bold text-slate-400">Archivos y Listas</div>
            
            <button onclick="triggerTxtImport()" class="w-full text-left px-3 py-2 hover:bg-slate-800 flex items-center gap-2 text-slate-200">
              <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
              <span>Importar TXT</span>
            </button>

            <button onclick="exportTxt()" class="w-full text-left px-3 py-2 hover:bg-slate-800 flex items-center gap-2 text-slate-200">
              <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
              <span>Exportar lista a TXT</span>
            </button>

            <div class="border-t border-slate-800 my-1"></div>

            <button onclick="openSetlistsModal()" class="w-full text-left px-3 py-2 hover:bg-slate-800 flex items-center gap-2 text-slate-200">
              <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
              <span>Administrar Repertorios</span>
            </button>

            <button onclick="window.print(); hideDropdownMenu();" class="w-full text-left px-3 py-2 hover:bg-slate-800 flex items-center gap-2 text-slate-200">
              <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4H7v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
              <span>Imprimir / PDF</span>
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- SUB-BARRA: SELECTOR DE REPERTORIO ACTIVO (Dedicado y limpio) -->
    <div class="max-w-4xl mx-auto pt-2 pb-0.5 flex items-center justify-between text-xs border-t border-slate-800/60 mt-1.5">
      <div class="flex items-center gap-2 w-full">
        <span class="text-slate-400 text-[11px] font-medium shrink-0">Repertorio:</span>
        <div class="flex-1 min-w-0 relative">
          <select id="setlistSelect" onchange="switchSetlist(this.value)" class="w-full bg-slate-950/70 text-slate-200 border border-slate-700/80 rounded-lg px-2.5 py-1 text-xs font-semibold focus:outline-none focus:ring-1 focus:ring-emerald-500 cursor-pointer truncate">
          </select>
        </div>
        <button onclick="openSetlistsModal()" class="shrink-0 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-emerald-400 text-[11px] px-2.5 py-1 rounded-lg border border-slate-700 transition flex items-center gap-1" title="Gestionar listas">
          <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          <span class="hidden sm:inline">Administrar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- PANEL SUPERIOR: MINUTAJE Y RESUMEN EN VIVO -->
  <section class="relative z-10 max-w-4xl w-full mx-auto px-3 pt-3 pb-1">
    <div class="bg-slate-900/80 border border-slate-800/80 rounded-xl p-3 shadow-md grid grid-cols-2 sm:grid-cols-3 gap-2 text-center">
      
      <!-- Duración marcados (En Escenario) -->
      <div class="bg-slate-950/60 border border-emerald-500/30 rounded-lg p-2 col-span-1">
        <div class="text-[10px] uppercase font-bold tracking-wider text-emerald-400">En Escenario</div>
        <div id="checkedTimeDisplay" class="text-xl sm:text-2xl font-black text-emerald-300 font-mono tracking-tight">00:00</div>
        <div id="checkedCountDisplay" class="text-[10px] text-slate-400 font-medium">0 temas seleccionados</div>
      </div>

      <!-- Duración total lista -->
      <div class="bg-slate-950/60 border border-slate-800 rounded-lg p-2 col-span-1">
        <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Total Repertorio</div>
        <div id="totalTimeDisplay" class="text-xl sm:text-2xl font-bold text-slate-200 font-mono tracking-tight">00:00</div>
        <div id="totalCountDisplay" class="text-[10px] text-slate-400 font-medium">0 canciones</div>
      </div>

      <!-- Acciones de marcado rápido -->
      <div class="bg-slate-950/60 border border-slate-800 rounded-lg p-2 col-span-2 sm:col-span-1 flex flex-row sm:flex-col justify-center items-center gap-2">
        <button onclick="toggleSelectAll(true)" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-md border border-slate-700 w-full active:scale-95 transition">
          Marcar Todo
        </button>
        <button onclick="toggleSelectAll(false)" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 px-2.5 py-1 rounded-md border border-slate-700 w-full active:scale-95 transition">
          Desmarcar Todo
        </button>
      </div>

    </div>
  </section>

  <!-- LISTA PRINCIPAL DE CANCIONES -->
  <main class="relative z-10 max-w-4xl w-full mx-auto px-3 py-2 flex-1">
    <div id="trackListContainer" class="space-y-1">
      <!-- Inserción dinámica por JS -->
    </div>
    <div id="emptyListNotice" class="hidden text-center py-12 text-slate-500 text-sm">
      No hay temas en este repertorio. Usa el menú para importar un archivo TXT o añade temas manualmente.
    </div>
  </main>

  <!-- INPUT OCULTO PARA IMPORTAR TXT MULTIPLE -->
  <input type="file" id="txtFileInput" accept=".txt" multiple class="hidden" onchange="handleTxtFilesSelected(event)">

  <!-- MODAL: GESTIÓN DE REPERTORIOS -->
  <div id="setlistsModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-xl shadow-2xl p-4 flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="font-bold text-sm text-slate-200">Repertorios de la Banda</h3>
        <button onclick="closeSetlistsModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
      </div>
      
      <div class="my-3 flex gap-2">
        <input type="text" id="newSetlistNameInput" placeholder="Nombre nuevo repertorio..." class="bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white flex-1 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
        <button onclick="createSetlist()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-medium shrink-0">Crear</button>
      </div>

      <div id="modalSetlistItems" class="space-y-1.5 overflow-y-auto flex-1 pr-1 custom-scrollbar text-xs">
        <!-- Render dinámico -->
      </div>
      
      <div class="pt-3 border-t border-slate-800 mt-2 flex justify-end">
        <button onclick="closeSetlistsModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-lg">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: EDITAR / AÑADIR CANCIÓN -->
  <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-xl shadow-2xl p-4">
      <h3 id="editModalTitle" class="font-bold text-sm text-slate-200 mb-3">Editar Canción</h3>
      <input type="hidden" id="editTrackId">
      
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Título</label>
          <input type="text" id="editTitleInput" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:ring-1 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Artista / Referencia</label>
          <input type="text" id="editArtistInput" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white focus:ring-1 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Duración (MM:SS o SSS)</label>
          <input type="text" id="editDurationInput" placeholder="Ej: 03:45 o 225" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-mono focus:ring-1 focus:ring-emerald-500 focus:outline-none">
        </div>
      </div>

      <div class="mt-4 flex justify-end gap-2 text-xs">
        <button onclick="closeEditModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">Cancelar</button>
        <button onclick="saveEditModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg font-medium">Aceptar</button>
      </div>
    </div>
  </div>

  <!-- LOGOS EN BASE64 EMBEBIDOS Y LÓGICA -->
  <script>
    // LOGO 1: APRIL CREW (Reproducción vectorial exacta de la imagen adjunta)
    const LOGO_APRIL_CREW_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><circle cx='250' cy='250' r='244' fill='%23ffffff' stroke='%23111111' stroke-width='2'/><g fill='none' stroke='%23111111' stroke-linecap='round'><path d='M 248,255 C 248,318 195,372 132,372 C 66,372 16,320 16,252 C 16,182 68,128 136,128 C 204,128 258,180 258,248' stroke-width='5.5'/><path d='M 254,250 C 254,316 202,368 136,368 C 72,368 22,316 22,250 C 22,184 72,134 136,134 C 200,134 254,184 254,250' stroke-width='3.5'/><path d='M 34,195 C 58,148 104,125 156,130' stroke-width='3'/><path d='M 18,262 C 25,326 76,376 144,375 C 185,374 225,342 268,324 C 318,303 385,303 458,305' stroke-width='6'/><path d='M 136,372 C 182,372 222,340 264,322 C 314,301 382,301 456,304' stroke-width='4'/></g><g fill='%23111111'><path d='M 118,370 L 118,318' stroke='%23111111' stroke-width='2.6' stroke-linecap='round'/><path d='M 118,325 C 106,322 98,312 97,298 C 106,301 114,309 118,321 Z'/><path d='M 118,325 C 130,322 138,312 139,298 C 130,301 122,309 118,321 Z'/><path d='M 118,311 C 107,307 100,297 100,283 C 109,287 115,295 118,307 Z'/><path d='M 118,311 C 129,307 136,297 136,283 C 127,287 121,295 118,307 Z'/><path d='M 118,297 C 108,292 103,283 104,270 C 112,275 116,283 118,293 Z'/><path d='M 118,297 C 128,292 133,283 132,270 C 124,275 120,283 118,293 Z'/><path d='M 118,284 C 110,278 107,270 109,260 C 115,265 117,272 118,280 Z'/><path d='M 118,284 C 126,278 129,270 127,260 C 121,265 119,272 118,280 Z'/><path d='M 118,272 C 114,264 115,256 118,250 C 121,256 122,264 118,272 Z'/><g stroke='%23111111' stroke-width='0.9' stroke-linecap='round'><line x1='99' y1='299' x2='97' y2='293'/><line x1='102' y1='301' x2='100' y2='295'/><line x1='137' y1='299' x2='139' y2='293'/><line x1='134' y1='301' x2='136' y2='295'/><line x1='102' y1='284' x2='100' y2='278'/><line x1='105' y1='286' x2='103' y2='280'/><line x1='134' y1='284' x2='136' y2='278'/><line x1='131' y1='286' x2='133' y2='280'     // LOGO 2: LOCAL 13 (Réplica exacta de la chapa circular blanca con guitarra acústica, círculo izq, picas der y tipografía angular)
    const LOGO_LOCAL_13_SVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 500'><defs><filter id='sh' x='-10%25' y='-10%25' width='120%25' height='120%25'><feDropShadow dx='0' dy='4' stdDeviation='8' flood-opacity='0.25'/></filter></defs><circle cx='250' cy='250' r='238' fill='%23ffffff' stroke='%23d1d5db' stroke-width='4' filter='url(%23sh)'/><circle cx='145' cy='125' r='14' fill='none' stroke='%23222222' stroke-width='7.5'/><path d='M370,75 C354,105 342,120 342,133 C342,143 351,152 363,152 C370,152 375,148 375,145 C375,148 380,152 387,152 C399,152 408,143 408,133 C408,120 396,105 380,75 Z' fill='%23222222'/><path d='M371,152 L368,166 L382,166 L379,152 Z' fill='%23222222'/><path d='M205,95 A 100 100 0 0 1 295 95' fill='none' stroke='%23222222' stroke-width='6' stroke-linecap='round'/><path d='M340,147 A 100 100 0 0 1 330 250' fill='none' stroke='%23222222' stroke-width='6' stroke-linecap='round'/><path d='M170,250 A 100 100 0 0 1 160 147' fill='none' stroke='%23222222' stroke-width='6' stroke-linecap='round'/><line x1='120' y1='147' x2='380' y2='147' stroke='%23222222' stroke-width='5.5'/><line x1='120' y1='175' x2='380' y2='175' stroke='%23222222' stroke-width='5.5'/><line x1='120' y1='205' x2='380' y2='205' stroke='%23222222' stroke-width='5.5'/><path d='M237,76 L263,76 L263,105 C278,110 286,120 286,133 C286,145 278,154 275,158 C294,170 304,188 304,208 C304,233 280,250 250,250 C220,250 196,233 196,208 C196,188 206,170 225,158 C222,154 214,145 214,133 C214,120 222,110 237,105 Z' fill='none' stroke='%23222222' stroke-width='7.5'/><line x1='244' y1='76' x2='244' y2='135' stroke='%23222222' stroke-width='2.5'/><line x1='250' y1='76' x2='250' y2='135' stroke='%23222222' stroke-width='2.5'/><line x1='256' y1='76' x2='256' y2='135' stroke='%23222222' stroke-width='2.5'/><circle cx='250' cy='152' r='14' fill='none' stroke='%23222222' stroke-width='5'/><circle cx='250' cy='152' r='8' fill='none' stroke='%23222222' stroke-width='2'/><re     // ARRASTRE TÁCTIL Y DE RATÓN
    let draggedRow = null;
    let dragIndex = -1;

    function setupDragEvents(row) {
      const handle = row.querySelector('.drag-handle');

      handle.addEventListener('pointerdown', (e) => {
        draggedRow = row;
        dragIndex = parseInt(row.dataset.index, 10);
        row.classList.add('drag-ghost');
        handle.setPointerCapture(e.pointerId);

        const onPointerMove = (moveEvent) => {
          if (!draggedRow) return;
          const target = document.elementFromPoint(moveEvent.clientX, moveEvent.clientY);
          const targetRow = target ? target.closest('.track-item') : null;
          
          document.querySelectorAll('.track-item').forEach(el => el.classList.remove('drag-target-indicator'));
          if (targetRow && targetRow !== draggedRow) {
            targetRow.classList.add('drag-target-indicator');
          }
        };

        const onPointerUp = (upEvent) => {
          handle.releasePointerCapture(upEvent.pointerId);
          handle.removeEventListener('pointermove', onPointerMove);
          handle.removeEventListener('pointerup', onPointerUp);

          if (!draggedRow) return;
          draggedRow.classList.remove('drag-ghost');
          document.querySelectorAll('.track-item').forEach(el => el.classList.remove('drag-target-indicator'));

          const target = document.elementFromPoint(upEvent.clientX, upEvent.clientY);
          const targetRow = target ? target.closest('.track-item') : null;

          if (targetRow && targetRow !== draggedRow) {
            const targetIndex = parseInt(targetRow.dataset.index, 10);
            reorderTracks(dragIndex, targetIndex);
          }
          draggedRow = null;
          dragIndex = -1;
        };

        handle.addEventListener('pointermove', onPointerMove);
        handle.addEventListener('pointerup', onPointerUp);
      });
    }

    function reorderTracks(fromIndex, toIndex) {
      const tracks = [...getActiveTracks()];

      setActiveTracks(tracks);

    function updateMetrics() {
      const tracks = getActiveTracks();
      let totalSec = 0;
      let checkedSec = 0;
      let checkedCount = 0;

      tracks.forEach(t => {
        const sec = parseInt(t.duration, 10) || 0;
        totalSec += sec;
        if (t.checked) {
          checkedSec += sec;
          checkedCount++;
        }
      });

      document.getElementById('checkedTimeDisplay').textContent = formatDuration(checkedSec);
      document.getElementById('checkedCountDisplay').textContent = `${checkedCount} de ${tracks.length} temas`;

      document.getElementById('totalTimeDisplay').textContent = formatDuration(totalSec);
      document.getElementById('totalCountDisplay').textContent = `${tracks.length} temas en lista`;
    }

    // FORMATEO DE TIEMPO
    function formatDuration(totalSeconds) {
      const sec = Math.max(0, parseInt(totalSeconds, 10) || 0);
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      const h = Math.floor(m / 60);
      const remM = m % 60;

      if (h > 0) {
        return `${h}h ${remM < 10 ? '0' : ''}${remM}m`;
      }
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function parseDurationString(str) {
      if (!str) return 0;
      const trimmed = str.trim();
      if (/^\d+$/.test(trimmed)) return parseInt(trimmed, 10);
      const parts = trimmed.split(':');
      if (parts.length === 2) {
        return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
      }
      if (parts.length === 3) {
        return (parseInt(parts[0], 10) || 0) * 3600 + (parseInt(parts[1], 10) || 0) * 60 + (parseInt(parts[2], 10) || 0);
      }
      return 0;
    }

    function handleTxtFilesSelected(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const bandObj = appData.bands[currentBandKey];

      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const content = event.target.result;
          const parsedTracks = parseSetlistText(content);

          if (parsedTracks.length > 0) {
            const listKey = 'list_' + Date.now() + '_' + Math.floor(Math.random()*1000);
            const listName = file.name.replace(/\.[^/.]+$/, "");
            
            bandObj.setlists[listKey] = {
              name: listName,
              tracks: parsedTracks
            };
            bandObj.activeSetlistId = listKey;

            populateSetlistDropdown();
            renderTrackList();
            updateMetrics();
            markAsModified();
          }
        };
        reader.readAsText(file);
      });
    }

    function parseSetlistText(text) {
      const lines = text.split(/\r?\n/);
      const tracks = [];
      let nextId = Date.now();

      lines.forEach(rawLine => {
        let line = rawLine.trim();
        if (!line) return;
        line = line.replace(/^\d+[\.\-\)]\s*/, '');

        let title = line;
        let artist = "";
        let duration = 180;

        const parts = line.split('-').map(p => p.trim());
        if (parts.length >= 3) {
          title = parts[0];
          artist = parts[1];
          duration = parseDurationString(parts[2]);
        } else if (parts.length === 2) {
          title = parts[0];
          if (/[:\d]+/.test(parts[1])) {
            duration = parseDurationString(parts[1]);
          } else {
            artist = parts[1];
          }
        }

        tracks.push({
          id: nextId++,
          title: title || "Tema sin título",
          artist: artist,
          duration: duration || 180,
          checked: true
        });
      });

      return tracks;
    }

    function exportTxt() {
      hideDropdownMenu();
      const bandObj = appData.bands[currentBandKey];
      const activeList = bandObj.setlists[bandObj.activeSetlistId];
      if (!activeList || !activeList.tracks.length) {
        return;
      }

      let txtContent = "";
      activeList.tracks.forEach(t => {
        const m = Math.floor(t.duration / 60);
        const s = t.duration % 60;
        const durStr = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        txtContent += `${t.title} - ${t.artist || currentBandKey} - ${durStr}\n`;
      });

      const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${activeList.name.replace(/\s+/g, '_')}_setlist.txt`;
      a.click();
      URL.revokeObjectURL(url);
    }

        const isCurrent = id === bandObj.activeSetlistId;

        const div = document.createElement('div');
        div.className = `flex items-center justify-between p-2 rounded-lg border gap-2 ${isCurrent ? 'border-emerald-500 bg-emerald-950/20' : 'border-slate-800 bg-slate-950/50'}`;
        div.innerHTML = `
          <div class="truncate flex-1 min-w-0">
            <span class="font-bold text-slate-200 block truncate" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>
            <span class="text-[10px] text-slate-400 block">${item.tracks.length} temas</span>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <!-- Botón Renombrar -->
            <button onclick="renameSetlist('${id}')" class="p-1 text-slate-400 hover:text-amber-400 transition" title="Renombrar repertorio">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </button>
            ${!isCurrent ? `<button onclick="activateSetlistFromModal('${id}')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[11px] transition">Activar</button>` : '<span class="text-[10px] text-emerald-400 font-bold px-1.5 py-0.5 rounded bg-emerald-950/60 border border-emerald-700/50">Activo</span>'}
            ${Object.keys(bandObj.setlists).length > 1 ? `<button onclick="deleteSetlist('${id}')" class="p-1 text-slate-500 hover:text-rose-400 transition" title="Eliminar repertorio"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renameSetlist(id) {
      const bandObj = appData.bands[currentBandKey];
      const target = bandObj && bandObj.setlists[id];
      if (!target) return;

      const newName = prompt("Nuevo nombre para el repertorio:", target.name);
      if (newName && newName.trim() && newName.trim() !== target.name) {
        target.name = newName.trim();
        populateSetlistDropdown();
        renderModalSetlists();
        markAsModified();
      }
    }

    function activateSetlistFromModal(id) {
      switchSetlist(id);
      populateSetlistDropdown();
      renderModalSetlists();
    }

    function createSetlist() {
      const input = document.getElementById('newSetlistNameInput');
      const name = input.value.trim();
      if (!name) return;

      const bandObj = appData.bands[currentBandKey];
      const newId = 'list_' + Date.now();
      bandObj.setlists[newId] = {
        name: name,
        tracks: []
      };
      bandObj.activeSetlistId = newId;

      input.value = '';
      populateSetlistDropdown();
      renderModalSetlists();
      renderTrackList();
      updateMetrics();
      markAsModified();
    }

    function deleteSetlist(id) {
      const bandObj = appData.bands[currentBandKey];
      if (Object.keys(bandObj.setlists).length <= 1) return;

      delete bandObj.setlists[id];
      if (bandObj.activeSetlistId === id) {
        bandObj.activeSetlistId = Object.keys(bandObj.setlists)[0];
      }
      populateSetlistDropdown();
      renderModalSetlists();
      renderTrackList();
      updateMetrics();
      markAsModified();
    }

    // MODAL DE EDICIÓN Y NUEVO TEMA
    function openAddModal() {
      document.getElementById('editModalTitle').textContent = "Añadir Nueva Canción";
      document.getElementById('editTrackId').value = "";
      document.getElementById('editTitleInput').value = "";
      document.getElementById('editArtistInput').value = "";
      document.getElementById('editDurationInput').value = "03:30";
      document.getElementById('editModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      const track = getActiveTracks().find(t => t.id === id);
      if (!track) return;
      document.getElementById('editModalTitle').textContent = "Editar Canción";
      document.getElementById('editTrackId').value = track.id;
      document.getElementById('editTitleInput').value = track.title;
      document.getElementById('editArtistInput').value = track.artist || "";
      
      const m = Math.floor(track.duration / 60);
      const s = track.duration % 60;
      document.getElementById('editDurationInput').value = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveEditModal() {
      const id = document.getElementById('editTrackId').value;
      const title = document.getElementById('editTitleInput').value.trim();
      const artist = document.getElementById('editArtistInput').value.trim();
      const durationStr = document.getElementById('editDurationInput').value;

      if (!title) return;

      const duration = parseDurationString(durationStr);
      const tracks = [...getActiveTracks()];

      if (id) {
        const track = tracks.find(t => t.id === parseInt(id, 10));
        if (track) {
          track.title = title;
          track.artist = artist;
          track.duration = duration;
        }
      } else {
        tracks.push({
          id: Date.now(),
          title: title,
          artist: artist,
          duration: duration || 180,
          checked: true
        });
      }

      setActiveTracks(tracks);
      closeEditModal();
      renderTrackList();
      updateMetrics();
    }

    function deleteTrack(id) {
      const tracks = getActiveTracks().filter(t => t.id !== id);
      setActiveTracks(tracks);
      renderTrackList();
      updateMetrics();
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
